<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCL IT Monitor</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--text:#1d2330;--muted:#6b7280;--line:#dde2ea;--accent:#1f3a5f;--gold:#d4a536;
--up:#2e7d32;--upbg:#c8e6c9;--int:#7a5f00;--intbg:#fff3b0;--down:#c62828;--downbg:#ffcdd2;--pay:#1565c0;--paybg:#bbdefb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121620;--surface:#1b2130;--text:#e6e9f0;--muted:#9aa3b2;--line:#2c3446;--accent:#2d4f7c;--gold:#e0b85a}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0}
header small{opacity:.8;display:block;font-size:12px}
header label{font-size:12px;display:flex;flex-direction:column;gap:2px}
nav{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:9}
nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--gold)}
main{max-width:1400px;margin:0 auto;padding:18px}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:14px;margin:14px 0 6px}
p.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border-color:transparent;color:var(--accent)}
button.danger{color:var(--down)}
header select,header input{background:#fff;color:#1d2330;border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row.between{justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .n{font-size:26px;font-weight:700;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
th{background:var(--bg);font-weight:600}
td.name,th.name{text-align:left;min-width:180px;position:sticky;left:0;background:var(--surface);z-index:1}
td select{padding:2px 3px;font-size:12px;border-radius:4px;width:46px}
th.today,td.today{outline:2px solid var(--gold);outline-offset:-2px}
.s-up{background:var(--upbg);color:var(--up)}.s-int{background:var(--intbg);color:var(--int)}
.s-down{background:var(--downbg);color:var(--down)}.s-pay{background:var(--paybg);color:var(--pay)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;margin-right:6px}
.muted{color:var(--muted);font-size:12px}
.bold{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
form.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
form.grid label input,form.grid label select{color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
ol.steps li,ul.tips li{margin-bottom:6px}
dl dt{font-weight:700;margin-top:8px}dl dd{margin:2px 0 0 0;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><h1>PCL IT Monitor</h1><small>Head Office and branch IT status</small></div>
  <div class="row">
    <label>Reporting month<input type="month" id="month"></label>
  </div>
</header>
<nav id="nav">
  <button data-tab="home">Home</button>
  <button data-tab="monitor">Daily Monitor</button>
  <button data-tab="inventory">Inventory</button>
  <button data-tab="summary">Summary</button>
  <button data-tab="help">Help</button>
</nav>
<main><div id="view"></div></main>
<div class="toast" id="toast"></div>

<script>
const KEY = "pcl-it-monitor-v1"; // same key as v1, so your saved data carries over
const SITES = ["Head Office","Banner","Batangas","Cavite","Meta","MTH","Paco","Pasig","Taylor"];
const TYPES = ["Desktop","Laptop","Printer","Internet"];
const WEEKS = [[1,7],[8,14],[15,21],[22,28],[29,31]];
const STATUS_CLASS = {"Up":"s-up","Intermittent":"s-int","Down":"s-down","Payment Issue":"s-pay"};

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thisMonth = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1); };
const todayDay = () => new Date().getDate();
const daysIn = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const pct = (c, n) => n ? Math.round(c / n * 100) + "%" : "–";

function seed(){
  const s = { assets: [], logs: {} };
  const isp = { "Head Office": ["EASTERN","-"], "Paco": ["STARLINK","-"], "Pasig": ["DITO","-"] };
  SITES.forEach(site => {
    const [main, backup] = isp[site] || ["-","-"];
    s.assets.push({ id: uid(), type: "Internet", site, tag: "", user: main, position: backup, model: "", remarks: "" });
  });
  return s;
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return seed();
}
let state = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast("Could not save in this browser. Please export a backup."); }
}

const ui = { tab: "home", month: thisMonth(), site: SITES[0], type: "Desktop", day: todayDay(),
  period: "month", week: 1, stype: "All", f: { site: "All", type: "All", q: "" }, form: null };
$("#month").value = ui.month;

/* ---------- helpers ---------- */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400);
}
function agg(assets, months, lo, hi){
  const vals = [];
  months.forEach(m => {
    const log = state.logs[m]; if (!log) return;
    const dim = daysIn(m);
    assets.forEach(a => {
      const L = log[a.id]; if (!L) return;
      for (let d = lo; d <= Math.min(hi, dim); d++) if (L[d]) vals.push(L[d]);
    });
  });
  const c = { "Up":0, "Down":0, "Intermittent":0, "Payment Issue":0 };
  vals.forEach(v => { if (c[v] !== undefined) c[v]++; });
  const n = vals.length;
  return { n, up: pct(c.Up, n), down: pct(c.Down, n), int: pct(c.Intermittent, n), pay: pct(c["Payment Issue"], n) };
}
function cellSelect(a, d, v, opts){
  return `<select data-cell="1" data-id="${a.id}" data-day="${d}" class="${STATUS_CLASS[v] || ""}" aria-label="${esc(a.tag||a.user)} day ${d}">` +
    opts.map(o => `<option value="${o}" ${o === (v || "") ? "selected" : ""}>${o || "·"}</option>`).join("") + `</select>`;
}
function assetName(a){
  return a.type === "Internet"
    ? `<b>${esc(a.user || "-")}</b><div class="muted">Backup: ${esc(a.position || "-")}</div>`
    : `<b>${esc(a.tag || "(no tag)")}</b><div class="muted">${esc(a.user || "")}${a.position ? " · " + esc(a.position) : ""}</div>`;
}
function legend(withPay){
  return `<div class="muted" style="margin:6px 0">
    <span class="chip s-up">Up</span><span class="chip s-int">Intermittent</span><span class="chip s-down">Down</span>
    ${withPay ? '<span class="chip s-pay">Payment Issue</span>' : ""}<span>· blank = not recorded</span></div>`;
}

/* ---------- Home ---------- */
function renderHome(){
  const m = ui.month, all = state.assets, net = all.filter(a => a.type === "Internet");
  const overall = agg(all, [m], 1, 31), inet = agg(net, [m], 1, 31);
  const isNow = m === thisMonth(), today = todayDay();
  const downToday = isNow ? all.filter(a => ((state.logs[m] || {})[a.id] || {})[today] === "Down").length : null;
  const byType = TYPES.map(t => `${all.filter(a => a.type === t).length} ${t}`).join(" · ");

  $("#view").innerHTML = `
  <div class="stats">
    <div class="stat"><div class="n">${all.length}</div><div class="l">Assets tracked</div><div class="muted">${byType}</div></div>
    <div class="stat"><div class="n">${overall.up}</div><div class="l">Overall uptime</div><div class="muted">${overall.n} recorded checks this month</div></div>
    <div class="stat"><div class="n">${inet.up}</div><div class="l">Internet uptime</div><div class="muted">${inet.down} down · ${inet.int} intermittent</div></div>
    <div class="stat"><div class="n">${downToday ?? "–"}</div><div class="l">Down today</div><div class="muted">${isNow ? "Assets marked Down today" : "Current month only"}</div></div>
  </div>
  <div class="card">
    <div class="row between"><div><h2>Sites this month</h2><p class="hint">Click a site to open its daily grid.</p></div>
      <div class="row"><button class="primary" data-tab="monitor">Open Daily Monitor</button><button data-tab="inventory">Manage inventory</button></div></div>
    <div class="wrap" style="margin-top:10px"><table>
      <thead><tr><th class="name">Site</th><th>Assets</th><th>UP%</th><th>DOWN%</th><th>INT%</th><th>Records</th></tr></thead>
      <tbody>${SITES.map(s => {
        const sa = all.filter(a => a.site === s), r = agg(sa, [m], 1, 31);
        return `<tr><td class="name"><button class="ghost" data-goto-site="${esc(s)}">${esc(s)}</button></td>
          <td>${sa.length}</td><td class="bold">${r.up}</td><td>${r.down}</td><td>${r.int}</td><td>${r.n}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>`;
}

/* ---------- Daily Monitor ---------- */
function monitorRows(){
  return state.assets.filter(a => a.site === ui.site && a.type === ui.type);
}
function renderMonitor(){
  const n = daysIn(ui.month), m = ui.month, log = state.logs[m] || {};
  const days = Array.from({length: n}, (_, i) => i + 1);
  const rows = monitorRows();
  const isNow = m === thisMonth();
  const opts = ["", "Up", "Intermittent", "Down"].concat(ui.type === "Internet" ? ["Payment Issue"] : []);
  if (ui.day > n) ui.day = n;

  const body = rows.length ? rows.map(a => {
    const L = log[a.id] || {};
    const r = agg([a], [m], 1, n);
    return `<tr><td class="name">${assetName(a)}</td>` +
      days.map(d => `<td class="${isNow && d === todayDay() ? "today" : ""}">${cellSelect(a, d, L[d], opts)}</td>`).join("") +
      `<td class="bold">${r.up}</td><td>${r.down}</td><td>${r.int}</td></tr>`;
  }).join("") : "";

  $("#view").innerHTML = `
  <div class="card">
    <div class="row between">
      <div class="row">
        <label class="muted">Site<select data-ui="site">${SITES.map(s => `<option ${s === ui.site ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
        <label class="muted">Type<select data-ui="type">${TYPES.map(t => `<option ${t === ui.type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      </div>
      <div class="row">
        <label class="muted">Day<select data-ui="day">${days.map(d => `<option value="${d}" ${d === ui.day ? "selected" : ""}>${d}</option>`).join("")}</select></label>
        <button data-action="fill-day" title="Sets every blank cell for this day to Up">Mark blanks Up for day ${ui.day}</button>
        <button data-action="export-monitor">Export CSV</button>
      </div>
    </div>
    <p class="hint">Pick a status in any cell. Changes save automatically. Today's column is outlined in gold.</p>
    ${legend(ui.type === "Internet")}
    ${rows.length ? `<div class="wrap"><table>
      <thead><tr><th class="name">Asset</th>${days.map(d => `<th class="${isNow && d === todayDay() ? "today" : ""}">${d}</th>`).join("")}<th>UP%</th><th>DOWN%</th><th>INT%</th></tr></thead>
      <tbody>${body}</tbody></table></div>`
      : `<div class="empty">No ${ui.type} assets at ${esc(ui.site)} yet. <br><button class="primary" style="margin-top:10px" data-tab="inventory">Add one in Inventory</button></div>`}
  </div>`;
}

/* ---------- Inventory ---------- */
function formHTML(a){
  const isNet = (a.type || "Desktop") === "Internet";
  return `<form class="grid" id="assetForm">
    <input type="hidden" name="id" value="${a ? a.id : ""}">
    <label>Type<select name="type">${TYPES.map(t => `<option ${t === (a?.type || "Desktop") ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label>Site<select name="site">${SITES.map(s => `<option ${s === (a?.site || ui.site) ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    <label>Asset tag or name<input name="tag" value="${esc(a?.tag)}"></label>
    <label><span data-lbl="user">${isNet ? "Main ISP" : "User"}</span><input name="user" value="${esc(a?.user)}"></label>
    <label><span data-lbl="position">${isNet ? "Backup ISP" : "Position"}</span><input name="position" value="${esc(a?.position)}"></label>
    <label>Model or brand<input name="model" value="${esc(a?.model)}"></label>
    <label>Remarks<input name="remarks" value="${esc(a?.remarks)}"></label>
    <label><span>&nbsp;</span><span class="row"><button class="primary" type="submit">${a ? "Save changes" : "Add asset"}</button><button type="button" data-action="cancel-form">Cancel</button></span></label>
  </form>`;
}
function renderInventory(){
  const f = ui.f, q = f.q.toLowerCase();
  const rows = state.assets.filter(a =>
    (f.site === "All" || a.site === f.site) && (f.type === "All" || a.type === f.type) &&
    (!q || [a.tag, a.user, a.position, a.model, a.remarks].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => a.site.localeCompare(b.site) || a.type.localeCompare(b.type));
  const editing = ui.form && ui.form !== "new" ? state.assets.find(a => a.id === ui.form) : null;

  $("#view").innerHTML = `
  <div class="row between" style="margin-bottom:12px">
    <div><h2>Inventory</h2><p class="hint">${state.assets.length} assets in total. Use the filters to find one, or add a new one.</p></div>
    <div class="row"><button class="primary" data-action="new-asset">+ New asset</button><button data-action="export-inv">Export CSV</button></div>
  </div>
  ${ui.form ? `<div class="card"><h3 style="margin-top:0">${editing ? "Edit asset" : "New asset"}</h3>${formHTML(editing)}
    <p class="hint">For Internet rows, "Main ISP" and "Backup ISP" are used instead of User and Position.</p></div>` : ""}
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <label class="muted">Site<select data-f="site"><option>All</option>${SITES.map(s => `<option ${s === f.site ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
      <label class="muted">Type<select data-f="type"><option>All</option>${TYPES.map(t => `<option ${t === f.type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="muted">Search<input data-f="q" value="${esc(f.q)}" placeholder="Tag, user, model…"></label>
    </div>
    ${rows.length ? `<div class="wrap"><table>
      <thead><tr><th>Site</th><th>Type</th><th>Tag or name</th><th>User / Main ISP</th><th>Position / Backup ISP</th><th>Model</th><th>Remarks</th><th></th></tr></thead>
      <tbody>${rows.map(a => `<tr>
        <td>${esc(a.site)}</td><td>${a.type}</td><td>${esc(a.tag)}</td><td>${esc(a.user)}</td><td>${esc(a.position)}</td>
        <td>${esc(a.model)}</td><td>${esc(a.remarks)}</td>
        <td><button class="ghost" data-edit="${a.id}">Edit</button> <button class="danger" data-del="${a.id}">Delete</button></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">No assets match these filters.</div>`}
  </div>`;
}

/* ---------- Summary ---------- */
function summaryScope(){
  const y = ui.month.slice(0,4);
  if (ui.period === "year") return { months: Array.from({length:12}, (_, i) => `${y}-${pad(i+1)}`), lo: 1, hi: 31,
    label: `Year ${y} (all recorded days in the year)` };
  if (ui.period === "week") { const [lo, hi] = WEEKS[ui.week-1];
    return { months: [ui.month], lo, hi, label: `Week ${ui.week} of ${ui.month} (days ${lo}–${hi})` }; }
  return { months: [ui.month], lo: 1, hi: 31, label: `Month ${ui.month}` };
}
function renderSummary(){
  const sc = summaryScope();
  const pool = state.assets.filter(a => ui.stype === "All" || a.type === ui.stype);
  const rows = SITES.map(s => ({ name: s, ...agg(pool.filter(a => a.site === s), sc.months, sc.lo, sc.hi) }));
  rows.push({ name: "All sites", ...agg(pool, sc.months, sc.lo, sc.hi) });

  $("#view").innerHTML = `
  <div class="card">
    <div class="row between" style="margin-bottom:10px">
      <div class="row">
        <label class="muted">Period<select data-ui="period">${["week","month","year"].map(p => `<option value="${p}" ${p === ui.period ? "selected" : ""}>${p[0].toUpperCase() + p.slice(1)}ly</option>`).join("")}</select></label>
        ${ui.period === "week" ? `<label class="muted">Week<select data-ui="week">${WEEKS.map((w, i) => `<option value="${i+1}" ${i+1 === ui.week ? "selected" : ""}>Week ${i+1} (days ${w[0]}–${w[1]})</option>`).join("")}</select></label>` : ""}
        <label class="muted">Asset type<select data-ui="stype"><option>All</option>${TYPES.map(t => `<option ${t === ui.stype ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      </div>
      <span class="muted">${sc.label}</span>
    </div>
    <div class="wrap"><table>
      <thead><tr><th class="name">Site</th><th>Records</th><th>UP%</th><th>DOWN%</th><th>INT%</th><th>Payment Issue%</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.name === "All sites" ? "bold" : ""}">
        <td class="name">${esc(r.name)}</td><td>${r.n}</td><td class="bold">${r.up}</td><td>${r.down}</td><td>${r.int}</td><td>${r.pay}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="hint">Percentages count recorded days only. Blank days are left out.</p>
  </div>`;
}

/* ---------- Help ---------- */
function renderHelp(){
  $("#view").innerHTML = `
  <div class="card">
    <h2>How to use PCL IT Monitor</h2>
    <p class="hint">The full manual is in the file PCL-IT-Monitor-Manual.md. The quick version is below.</p>
    <h3>Daily routine</h3>
    <ol class="steps">
      <li>Open <b>Daily Monitor</b>, pick the site and the asset type.</li>
      <li>Choose a status in each cell for today's date. Use the <b>Day</b> selector to record earlier days.</li>
      <li>Use <b>Mark blanks Up</b> to fill in every empty cell for a day when everything was working.</li>
    </ol>
    <h3>Statuses</h3>
    <dl>
      <dt><span class="chip s-up">Up</span></dt><dd>Working normally all day.</dd>
      <dt><span class="chip s-int">Intermittent</span></dt><dd>Working, but with drops or slowdowns.</dd>
      <dt><span class="chip s-down">Down</span></dt><dd>Not working.</dd>
      <dt><span class="chip s-pay">Payment Issue</span></dt><dd>Internet service suspended for non-payment (Internet rows only).</dd>
    </dl>
    <h3>Managing assets</h3>
    <ul class="tips">
      <li>Use <b>Inventory</b> to add, edit, or delete assets. Deleting also removes that asset's recorded history.</li>
      <li>Internet rows use Main ISP and Backup ISP in place of User and Position.</li>
    </ul>
    <h3>Backup and restore</h3>
    <p class="hint">Data is saved in this browser only. Back it up regularly.</p>
    <div class="row" style="margin-top:8px">
      <button class="primary" data-action="backup">Download backup</button>
      <label class="muted">Restore from backup <input type="file" accept="application/json" data-restore="1"></label>
    </div>
  </div>`;
}

/* ---------- Shell ---------- */
function render(){
  document.querySelectorAll("nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === ui.tab));
  ({ home: renderHome, monitor: renderMonitor, inventory: renderInventory, summary: renderSummary, help: renderHelp })[ui.tab]();
}
function download(name, text, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function csvOf(rows){ return rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\n"); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-action],[data-edit],[data-del],[data-goto-site]");
  if (!el) return;
  if (el.dataset.tab) { ui.tab = el.dataset.tab; ui.form = null; render(); window.scrollTo(0,0); return; }
  if (el.dataset.gotoSite) { ui.site = el.dataset.gotoSite; ui.tab = "monitor"; render(); return; }
  if (el.dataset.edit) { ui.form = el.dataset.edit; render(); window.scrollTo(0,0); return; }
  if (el.dataset.del) {
    const a = state.assets.find(x => x.id === el.dataset.del);
    if (!a || !confirm(`Delete "${a.tag || a.user || a.type}" at ${a.site} and all its recorded history?`)) return;
    state.assets = state.assets.filter(x => x.id !== a.id);
    Object.values(state.logs).forEach(m => delete m[a.id]);
    save(); render(); toast("Asset deleted"); return;
  }
  switch (el.dataset.action) {
    case "new-asset": ui.form = "new"; render(); window.scrollTo(0,0); break;
    case "cancel-form": ui.form = null; render(); break;
    case "fill-day": {
      const m = ui.month, d = ui.day; let count = 0;
      state.logs[m] = state.logs[m] || {};
      monitorRows().forEach(a => {
        const L = state.logs[m][a.id] = state.logs[m][a.id] || {};
        if (!L[d]) { L[d] = "Up"; count++; }
      });
      save(); render(); toast(count ? `Set ${count} blank cell(s) to Up for day ${d}` : "No blank cells to fill for this day");
      break;
    }
    case "export-monitor": {
      const m = ui.month, n = daysIn(m), log = state.logs[m] || {};
      const rows = monitorRows().map(a => {
        const L = log[a.id] || {}; const vals = Array.from({length:n}, (_, i) => L[i+1] || "");
        const r = agg([a], [m], 1, n);
        return [a.tag || a.user, ...vals, r.up, r.down, r.int];
      });
      download(`${ui.site}-${ui.type}-${m}.csv`, csvOf([["Asset", ...Array.from({length:n}, (_, i) => i+1), "UP%", "DOWN%", "INT%"], ...rows]), "text/csv");
      break;
    }
    case "export-inv": {
      const rows = state.assets.map(a => [a.site, a.type, a.tag, a.user, a.position, a.model, a.remarks]);
      download("pcl-it-inventory.csv", csvOf([["Site","Type","Tag","User/Main ISP","Position/Backup ISP","Model","Remarks"], ...rows]), "text/csv");
      break;
    }
    case "backup":
      download(`pcl-it-monitor-backup-${thisMonth()}.json`, JSON.stringify(state, null, 2), "application/json"); break;
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "month") { ui.month = t.value || thisMonth(); render(); return; }
  if (t.dataset.ui) {
    ui[t.dataset.ui] = ["week","day"].includes(t.dataset.ui) ? Number(t.value) : t.value;
    render(); return;
  }
  if (t.dataset.f) { ui.f[t.dataset.f] = t.value; renderInventory(); return; }
  if (t.dataset.cell) {
    const m = ui.month;
    state.logs[m] = state.logs[m] || {};
    const L = state.logs[m][t.dataset.id] = state.logs[m][t.dataset.id] || {};
    if (t.value) L[t.dataset.day] = t.value; else delete L[t.dataset.day];
    save(); renderMonitor(); return;
  }
  if (t.name === "type" && t.form && t.form.id === "assetForm") {
    const net = t.value === "Internet";
    t.form.querySelector('[data-lbl="user"]').textContent = net ? "Main ISP" : "User";
    t.form.querySelector('[data-lbl="position"]').textContent = net ? "Backup ISP" : "Position";
    return;
  }
  if (t.dataset.restore) {
    const file = t.files[0]; if (!file) return;
    file.text().then(txt => {
      let d; try { d = JSON.parse(txt); } catch (err) { d = null; }
      if (!d || !Array.isArray(d.assets) || typeof d.logs !== "object") { toast("That is not a valid backup file"); return; }
      if (!confirm("Replace all current data with this backup?")) return;
      state = d; save(); render(); toast("Backup restored");
    });
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.f === "q") { ui.f.q = e.target.value; renderInventory(); const i = document.querySelector('[data-f="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "assetForm") return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const rec = { type: d.type, site: d.site, tag: d.tag.trim(), user: d.user.trim(), position: d.position.trim(),
    model: d.model.trim(), remarks: d.remarks.trim() };
  if (d.id) { Object.assign(state.assets.find(a => a.id === d.id) || {}, rec); toast("Changes saved"); }
  else { state.assets.push({ id: uid(), ...rec }); toast("Asset added"); }
  ui.form = null; save(); render();
});

render();
</script>
</body>
</html>
